apiVersion: apps/v1
kind: Deployment

metadata:
  name: express-app

spec:
  replicas: 2

  selector:
    matchLabels:
      app: express-app

  template:
    metadata:
      labels:
        app: express-app

    spec:
      containers:
        - name: express-app
          image: express-k8s:v1
          imagePullPolicy: Never

          ports:
            - containerPort: 3000

          env:
            - name: DB_HOST
              value: host.docker.internal

            - name: DB_PORT
              value: "3306"

            - name: DB_USER
              value: "root"

            - name: DB_PASSWORD
              value: ""

            - name: DB_NAME
              value: "smart_farm"

            - name: PORT
              value: "3000"